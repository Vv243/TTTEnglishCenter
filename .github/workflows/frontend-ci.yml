name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run linter (if configured)
      run: |
        cd frontend
        npm run lint || echo "Linting will be configured later"
      continue-on-error: true
    
    - name: Build (if possible)
      run: |
        cd frontend
        npm run build || echo "Build will work once we add code"
      continue-on-error: true